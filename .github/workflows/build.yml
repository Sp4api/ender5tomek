name: Build Marlin Firmware

on:
  workflow_dispatch: # Pozwala na ręczne uruchomienie kompilacji guzikiem

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install -U platformio

    - name: Run PlatformIO Build for SKR Mini E3 V3
      run: |
        pio run -e STM32G0B1RE_btt

    - name: Upload Firmware Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Marlin-Firmware-SKR-Mini-E3-V3
        path: .pio/build/STM32G0B1RE_btt/firmware.bin
